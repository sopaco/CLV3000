[package]
name = "clv3000"
version = "0.7.7"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
muda = "0.19.3"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
toml = "1.1.4"
tray-icon = "0.24.2"
walkdir = "2.5.0"
blake3 = "1"   # 文件基因缓存：内容哈希，纯 Rust、跨平台、比 SHA-256 快很多

# 只在真的编译 Windows 目标时才拉 `windows` crate 及其一大串子 crate 进依赖图——
# 这些子 crate 里有的（比如 windows-future）在非 Windows target 上编译不干净，
# 之前把它写成普通 [dependencies] 会导致哪怕代码里全用 #[cfg(windows)] 保护好了，
# Cargo 依然会尝试给 macOS/Linux target 编译整个 windows 依赖图，直接编译失败。
[target.'cfg(windows)'.dependencies]
# Win32_System_Registry：`autostart.rs`（HKCU\...\Run 开机自启动开关）和
# `context_menu.rs`（HKCU\Software\Classes 右键"用 CLV3000 扫描"）共用同一个
# feature，都是只读写 HKEY_CURRENT_USER，不需要管理员权限。
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Registry"] }

# macOS 专属：检测 Dock 图标点击 / Cmd+Tab 切回本 App，用于唤回被隐藏到托盘的主窗口
# （winit 0.30 故意不处理 macOS 的 dock 重新打开事件，见 src/macos_reopen.rs）。
# 版本号与依赖图里已锁定的 objc2 完全一致，不会触发重新解析或联网下载。
#
# objc2-foundation 只开 NSProcessInfo/NSString 两个 feature（默认 feature 集
# 巨大，几十个 Foundation 类全开），已经作为 objc2-app-kit 的间接依赖存在于
# 依赖图里，这里加最小 feature 集不会触发重新联网解析。用途见
# `macos_reopen::ScanActivity`：扫描期间告诉系统"这是用户发起的前台工作，
# 不要 App Nap"，避免从"窗口被遮挡/非活跃"节流状态里被动唤醒时那一下卡顿。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSProcessInfo", "NSString", "NSNotification"] }
block2 = "0.6"

# 给 exe 嵌图标资源用的（见 build.rs）。
#
# 注意：这里**不能**照搬上面 `windows` 依赖那样写成
# `[target.'cfg(windows)'.build-dependencies]`——build-dependencies 是在构建
# 这台机器（host）上编译并运行的（构建脚本本身跑在 host 上，不是跑在最终
# 编译目标上），Cargo 对 `[target.cfg(...)]` 里的 build-dependencies 是按
# **host** 平台去匹配 cfg 谓词的，不是按 `--target` 指定的目标平台。实测在这台
# macOS host 上交叉编译 `--target x86_64-pc-windows-gnu`，`cfg(windows)` 对
# host（macOS）不成立，`winresource` 会被 Cargo 直接从构建图里剔除，`build.rs`
# 里的图标嵌入代码根本不会被编译进去、也就不会执行——图标照样嵌不上，而且
# 编译期没有任何报错，非常隐蔽。所以这里干脆不加 target 限定，任何 host 上都
# 把 `winresource` 编译进构建脚本，真正的"只在 Windows 上生效"完全交给
# `build.rs` 里那个 `#[cfg(windows)]`（那个是判断最终编译目标，用对了）。
[build-dependencies]
winresource = "0.1.31"

# 老机器优先：release 构建体积/内存优化
[profile.release]
opt-level = "s"   # 优化体积而非极限速度，老机器上更看重启动/换页开销
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Windows exe 文件属性（右键 → 属性 → 详细信息）的版本信息资源。
# [package.metadata.winresource] 的字段会覆盖 winresource 的默认值
# （默认 FileDescription / ProductName 都取自 CARGO_PKG_NAME = "clv3000"）。
# 仅在编译 Windows 目标时由 build.rs 里的 winresource 写入 PE 资源段。
[package.metadata.winresource]
ProductName     = "CLV3000"
FileDescription = "Fast, reliable virus protection for even older PCs."
CompanyName     = "SGNetworks"
LegalCopyright  = "Copyright © 2026 SGNetworks"
InternalName    = "clv3000"
OriginalFilename = "clv3000.exe"

# macOS 应用包（.app）配置，由 `cargo bundle` 读取，产出带图标的 CLV3000.app。
# 图标走 `icon`（文件本身在 assets/icons/icon_app.icns）；Info.plist 由 cargo-bundle 自动生成。
# 注意：此处**不**写 `resources = ["clamav"]`——clamav/ 在 .gitignore 里且仓库根通常不存在，
# 写死会导致 `cargo bundle` 在缺少该目录时报错。打包时自带引擎改由 scripts/bundle-macos.sh
# 在打包完成后再把本地 clamav/ 拷进 Contents/Resources/clamav（见脚本）。
[package.metadata.bundle]
name         = "CLV3000"
identifier   = "com.sgnetworks.clv3000"
icon         = ["assets/icons/icon_app.icns"]
category     = "Utility"
short_description = "Fast, reliable virus protection for even older PCs."
copyright    = "Copyright © 2026 SGNetworks"
